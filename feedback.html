<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAVTTC LMS | Feedback Form</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="db_manager.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0f172a',
            ocean: '#0f766e',
            skypro: '#0284c7',
            sun: '#f59e0b',
            berry: '#e11d48',
            soft: '#f8fbff'
          },
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
            display: ['Sora', 'sans-serif']
          },
          boxShadow: {
            luxe: '0 28px 80px rgba(15, 23, 42, 0.16)',
            card: '0 18px 40px rgba(15, 23, 42, 0.10)'
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(2,132,199,0.20), transparent 24%),
        radial-gradient(circle at top right, rgba(245,158,11,0.16), transparent 20%),
        radial-gradient(circle at bottom left, rgba(225,29,72,0.12), transparent 24%),
        linear-gradient(180deg, #f8fbff 0%, #eef7ff 45%, #ffffff 100%);
      min-height: 100vh;
      color: #0f172a;
    }
    .glass {
      background: rgba(255,255,255,0.84);
      border: 1px solid rgba(148,163,184,0.18);
      backdrop-filter: blur(18px);
      box-shadow: 0 28px 80px rgba(15,23,42,0.16);
    }
    .hero {
      background:
        radial-gradient(circle at top right, rgba(255,255,255,0.12), transparent 30%),
        radial-gradient(circle at bottom left, rgba(34,197,94,0.18), transparent 30%),
        linear-gradient(135deg, #ffffff 0%, #e0f2fe 42%, #dcfce7 100%);
    }
    .choice-input,
    .star-input { display:none; }
    .choice-card {
      transition: all .22s ease;
    }
    .choice-input:checked + .choice-card {
      border-color: rgba(2,132,199,0.42);
      background: linear-gradient(135deg, rgba(224,242,254,0.98), rgba(255,255,255,1));
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(2,132,199,0.16);
    }
    .star-wrap {
      display:flex;
      flex-direction:row-reverse;
      justify-content:flex-start;
      gap:.55rem;
    }
    .star-label {
      color:#cbd5e1;
      cursor:pointer;
      transition: transform .2s ease, color .2s ease;
    }
    .star-input:checked ~ .star-label,
    .star-label:hover,
    .star-label:hover ~ .star-label {
      color:#f59e0b;
    }
    .star-label:hover { transform: scale(1.08); }
  </style>
</head>
<body>
  <main class="px-4 py-6 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-5xl space-y-6">
      <div id="feedbackMessage" class="hidden rounded-3xl border px-5 py-4 text-sm font-semibold"></div>

      <section class="glass overflow-hidden rounded-[34px]">
        <div class="hero relative px-6 py-8 text-white sm:px-8 sm:py-10">
          <div class="absolute -right-10 top-6 h-40 w-40 rounded-full bg-sky-200/50 blur-3xl"></div>
          <div class="absolute -left-8 bottom-0 h-32 w-32 rounded-full bg-emerald-200/60 blur-3xl"></div>
          <div class="relative z-10 flex flex-col gap-6 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-start gap-4">
              <div class="flex h-16 w-16 items-center justify-center rounded-[22px] border border-slate-200 bg-white shadow-card">
                <img src="assets/logo.png" alt="NAVTTC LMS Logo" class="h-10 w-10 object-contain">
              </div>
              <div>
                <p class="text-[11px] font-black uppercase tracking-[0.34em] text-sky-700">NAVTTC LMS</p>
                <h1 class="font-display text-3xl text-slate-900 sm:text-4xl">Feedback Form</h1>
              </div>
            </div>

          </div>
        </div>

        <div class="p-5 sm:p-8">
          <section class="mx-auto max-w-3xl">
            <form id="feedbackForm" class="space-y-6">
              <div class="rounded-[28px] border border-slate-200 bg-white p-5 sm:p-6 shadow-card">
                <div class="flex items-center gap-3">
                  <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-amber-100 text-sun"><i data-lucide="star" class="h-5 w-5"></i></div>
                  <label class="text-sm font-extrabold text-ink">LMS ka overall experience kaisa hai?</label>
                </div>
                <div class="mt-5 star-wrap">
                  <input class="star-input" id="star5" type="radio" name="rating" value="5" required>
                  <label class="star-label" for="star5"><i data-lucide="star" class="h-12 w-12 fill-current"></i></label>
                  <input class="star-input" id="star4" type="radio" name="rating" value="4">
                  <label class="star-label" for="star4"><i data-lucide="star" class="h-12 w-12 fill-current"></i></label>
                  <input class="star-input" id="star3" type="radio" name="rating" value="3">
                  <label class="star-label" for="star3"><i data-lucide="star" class="h-12 w-12 fill-current"></i></label>
                  <input class="star-input" id="star2" type="radio" name="rating" value="2">
                  <label class="star-label" for="star2"><i data-lucide="star" class="h-12 w-12 fill-current"></i></label>
                  <input class="star-input" id="star1" type="radio" name="rating" value="1">
                  <label class="star-label" for="star1"><i data-lucide="star" class="h-12 w-12 fill-current"></i></label>
                </div>
              </div>

              <div class="rounded-[28px] border border-slate-200 bg-white p-5 sm:p-6 shadow-card space-y-6">
                <div>
                  <div class="mb-3 flex items-center gap-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-cyan-100 text-skypro"><i data-lucide="book-open-text" class="h-5 w-5"></i></div>
                    <label class="text-sm font-extrabold text-ink">Course ka content kaisa hai?</label>
                  </div>
                  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-4">
                    <label><input class="choice-input" type="radio" name="content_quality" value="excellent" required><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Bohat achi</span></span></label>
                    <label><input class="choice-input" type="radio" name="content_quality" value="good"><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Achi</span></span></label>
                    <label><input class="choice-input" type="radio" name="content_quality" value="average"><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Theek thaak</span></span></label>
                    <label><input class="choice-input" type="radio" name="content_quality" value="poor"><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Kamzor</span></span></label>
                  </div>
                </div>

                <div>
                  <div class="mb-3 flex items-center gap-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-emerald-100 text-ocean"><i data-lucide="users" class="h-5 w-5"></i></div>
                    <label class="text-sm font-extrabold text-ink">Teacher ki madad aur rehnumai kaisi hai?</label>
                  </div>
                  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-4">
                    <label><input class="choice-input" type="radio" name="instructor_quality" value="excellent" required><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Bohat achi</span></span></label>
                    <label><input class="choice-input" type="radio" name="instructor_quality" value="good"><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Achi</span></span></label>
                    <label><input class="choice-input" type="radio" name="instructor_quality" value="average"><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Theek thaak</span></span></label>
                    <label><input class="choice-input" type="radio" name="instructor_quality" value="poor"><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Kamzor</span></span></label>
                  </div>
                </div>

                <div>
                  <div class="mb-3 flex items-center gap-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-violet-100 text-indigo-600"><i data-lucide="gauge" class="h-5 w-5"></i></div>
                    <label class="text-sm font-extrabold text-ink">Class aur course ki raftaar kaisi hai?</label>
                  </div>
                  <div class="grid gap-3 md:grid-cols-3">
                    <label><input class="choice-input" type="radio" name="course_pace" value="too_fast" required><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Bohat Tez</span></span></label>
                    <label><input class="choice-input" type="radio" name="course_pace" value="perfect"><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Bilkul theek</span></span></label>
                    <label><input class="choice-input" type="radio" name="course_pace" value="too_slow"><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Bohat aahista</span></span></label>
                  </div>
                </div>

                <div>
                  <div class="mb-3 flex items-center gap-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-pink-100 text-berry"><i data-lucide="monitor-smartphone" class="h-5 w-5"></i></div>
                    <label class="text-sm font-extrabold text-ink">LMS use karna kitna asaan hai?</label>
                  </div>
                  <div class="grid gap-3 md:grid-cols-3">
                    <label><input class="choice-input" type="radio" name="usability" value="yes" required><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Asaan</span></span></label>
                    <label><input class="choice-input" type="radio" name="usability" value="somewhat"><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Theek thaak</span></span></label>
                    <label><input class="choice-input" type="radio" name="usability" value="no"><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Mushkil</span></span></label>
                  </div>
                </div>

                <div>
                  <div class="mb-3 flex items-center gap-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-orange-100 text-sun"><i data-lucide="briefcase-business" class="h-5 w-5"></i></div>
                    <label class="text-sm font-extrabold text-ink">Kya LMS se aapka kaam asaan ho raha hai?</label>
                  </div>
                  <div class="grid gap-3 md:grid-cols-2">
                    <label><input class="choice-input" type="radio" name="would_recommend" value="yes" required><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Haan</span></span></label>
                    <label><input class="choice-input" type="radio" name="would_recommend" value="no"><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Nahi</span></span></label>
                  </div>
                </div>
              </div>

              <div class="rounded-[28px] border border-slate-200 bg-white p-5 sm:p-6 shadow-card">
                <div class="mb-3 flex items-center gap-3">
                  <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-teal-100 text-ocean"><i data-lucide="pen-square" class="h-5 w-5"></i></div>
                  <label class="text-sm font-extrabold text-ink">Agar koi mashwara dena ho to yahan likhein</label>
                </div>
                <textarea id="comments" name="comments" rows="6" class="w-full rounded-[24px] border border-slate-200 bg-slate-50 px-5 py-4 text-sm leading-7 text-slate-700 outline-none transition focus:border-ocean focus:bg-white focus:ring-4 focus:ring-cyan-100" placeholder="Apni simple feedback ya mashwara yahan likhein..."></textarea>
              </div>

              <div class="flex justify-end">
                <button id="submitBtn" type="submit" class="inline-flex items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-skypro to-ocean px-7 py-4 text-sm font-extrabold text-white shadow-card transition hover:scale-[1.01] disabled:cursor-not-allowed disabled:opacity-60">
                  <i data-lucide="send" class="h-4 w-4"></i>
                  Feedback Submit Karein
                </button>
              </div>
            </form>

            <div id="successState" class="hidden rounded-[30px] border border-emerald-200 bg-gradient-to-br from-emerald-50 to-white p-8 text-center shadow-card">
              <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-[28px] bg-white text-ocean">
                <i data-lucide="badge-check" class="h-10 w-10"></i>
              </div>
              <h2 class="mt-5 text-3xl font-extrabold text-ink">Feedback successfully submit ho gayi</h2>
              <a href="index.html" class="mt-6 inline-flex items-center gap-2 rounded-2xl bg-gradient-to-r from-skypro to-ocean px-6 py-3.5 text-sm font-extrabold text-white transition hover:scale-[1.01]">
                <i data-lucide="arrow-left" class="h-4 w-4"></i>
                Dashboard par wapas jayein
              </a>
            </div>
          </section>
        </div>
      </section>
    </div>
  </main>

  <script>
    lucide.createIcons();
    const SUPABASE_URL = 'https://fnkctvhrilynnmphdxuo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_q_jbUM95dckWS7YF1XSRgg_NvhZ4iyU';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const messageBox = document.getElementById('feedbackMessage');
    const form = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');
    const successState = document.getElementById('successState');

    function showMessage(type, text) {
      const styles = {
        info: 'border-sky-200 bg-sky-50 text-sky-900',
        success: 'border-emerald-200 bg-emerald-50 text-emerald-900',
        error: 'border-rose-200 bg-rose-50 text-rose-900'
      };
      messageBox.className = 'hidden rounded-3xl border px-5 py-4 text-sm font-semibold ' + (styles[type] || styles.info);
      messageBox.textContent = text;
      messageBox.classList.remove('hidden');
    }

    async function getSessionUser() {
      const { data: { session } } = await client.auth.getSession();
      if (!session?.user) {
        window.location.href = 'index.html';
        return null;
      }
      return session.user;
    }

    async function findProfile(uid) {
      let res = await client.from('profiles').select('uid, full_name, role, id').eq('uid', uid).maybeSingle();
      if (res.data) return res.data;
      res = await client.from('profiles').select('uid, full_name, role, id').eq('id', uid).maybeSingle();
      return res.data || null;
    }

    async function initPage() {
      const user = await getSessionUser();
      if (!user) return null;
      const profile = await findProfile(user.id);
      const role = profile?.role || 'student';
      const isAdminPreview = role === 'admin';

      if (role !== 'student' && !isAdminPreview) {
        window.location.href = 'index.html';
        return null;
      }

      if (!isAdminPreview && localStorage.getItem('feedback_submitted_' + user.id) === 'true') {
        window.location.href = 'index.html';
        return null;
      }

      if (!isAdminPreview) {
        const existing = await client.from('feedback').select('id').eq('student_id', user.id).maybeSingle();
        if (existing.data) {
          localStorage.setItem('feedback_submitted_' + user.id, 'true');
          window.location.href = 'index.html';
          return null;
        }
      }

      if (isAdminPreview) {
        showMessage('info', 'Admin preview mode on hai. Aap form dekh sakte hain lekin yahan se feedback save nahi hogi.');
      } else {
        showMessage('info', 'Neeche form fill karein. Sada aur asaan alfaaz mein apni raaye dein.');
      }

      return { user, profile, isAdminPreview };
    }

    function buildSummary(payload) {
      return [
        'Student Feedback Summary',
        'Student: ' + payload.student_name,
        'Overall Rating: ' + payload.rating + '/5',
        'Course ka content kaisa hai?: ' + payload.content_quality,
        'Teacher ki madad aur rehnumai kaisi hai?: ' + payload.instructor_quality,
        'Class aur course ki raftaar kaisi hai?: ' + payload.course_pace,
        'LMS use karna kitna asaan hai?: ' + payload.usability,
        'Kya LMS se aapka kaam asaan ho raha hai?: ' + payload.would_recommend,
        'Agar koi mashwara dena ho to yahan likhein: ' + (payload.comments || 'Koi extra comment nahi diya gaya.')
      ].join('\n');
    }

    function isDuplicate(error) {
      const msg = ((error?.message || '') + ' ' + (error?.details || '')).toLowerCase();
      return error?.code === '23505' || msg.includes('duplicate') || msg.includes('unique');
    }

    function hasSchemaIssue(error) {
      const msg = ((error?.message || '') + ' ' + (error?.details || '')).toLowerCase();
      return msg.includes('column') || msg.includes('schema') || msg.includes('student_name') || msg.includes('comments') || msg.includes('content_quality');
    }

    initPage().then((ctx) => {
      if (!ctx) return;

      if (ctx.isAdminPreview) {
        submitBtn.type = 'button';
        submitBtn.innerHTML = '<span class="inline-flex items-center gap-2"><i data-lucide="eye" class="h-4 w-4"></i>Preview Only</span>';
        submitBtn.addEventListener('click', () => {
          showMessage('info', 'Admin preview mode mein submit disabled hai. Student login se hi feedback save hogi.');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        lucide.createIcons();
        return;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const original = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="inline-flex items-center gap-2"><i data-lucide="loader-circle" class="h-4 w-4 animate-spin"></i>Submitting...</span>';
        lucide.createIcons();

        try {
          const data = new FormData(form);
          const payload = {
            id: ctx.user.id,
            student_id: ctx.user.id,
            student_name: ctx.profile?.full_name || ctx.user.email || 'Student',
            rating: Number(data.get('rating')),
            content_quality: data.get('content_quality'),
            instructor_quality: data.get('instructor_quality'),
            course_pace: data.get('course_pace'),
            usability: data.get('usability'),
            would_recommend: data.get('would_recommend'),
            comments: (data.get('comments') || '').toString().trim(),
            content: '',
            is_read: false,
            created_at: new Date().toISOString(),
            submitted_at: new Date().toISOString()
          };
          payload.content = buildSummary(payload);

          let result = await client.from('feedback').insert([payload]);
          if (result.error && hasSchemaIssue(result.error)) {
            result = await client.from('feedback').insert([{
              id: ctx.user.id,
              student_id: ctx.user.id,
              rating: payload.rating,
              content: payload.content,
              is_read: false,
              submitted_at: payload.submitted_at
            }]);
          }

          if (result.error && isDuplicate(result.error)) {
            showMessage('success', 'Aapki feedback pehle hi save ho chuki hai.');
            window.location.href = 'index.html';
            return;
          }
          if (result.error) throw result.error;

          localStorage.setItem('feedback_submitted_' + ctx.user.id, 'true');
          showMessage('success', 'Feedback successfully submit ho gayi.');
          form.classList.add('hidden');
          successState.classList.remove('hidden');
          lucide.createIcons();
        } catch (error) {
          console.error('Feedback submission failed:', error);
          showMessage('error', 'Feedback submit karne mein masla hua. Dobara try karein.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = original;
          lucide.createIcons();
        }
      });
    });
  </script>
</body>
</html>
