<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAVTTC LMS | Feedback Details</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="db_manager.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0f172a',
            ocean: '#0f766e',
            skypro: '#0284c7',
            sun: '#f59e0b',
            berry: '#e11d48',
            soft: '#f8fbff'
          },
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
            display: ['Sora', 'sans-serif']
          },
          boxShadow: {
            luxe: '0 28px 80px rgba(15, 23, 42, 0.16)',
            card: '0 18px 40px rgba(15, 23, 42, 0.10)'
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(2,132,199,0.20), transparent 24%),
        radial-gradient(circle at top right, rgba(245,158,11,0.16), transparent 20%),
        radial-gradient(circle at bottom left, rgba(225,29,72,0.12), transparent 24%),
        linear-gradient(180deg, #f8fbff 0%, #eef7ff 45%, #ffffff 100%);
      min-height: 100vh;
      color: #0f172a;
    }
    .glass {
      background: rgba(255,255,255,0.84);
      border: 1px solid rgba(148,163,184,0.18);
      backdrop-filter: blur(18px);
      box-shadow: 0 28px 80px rgba(15,23,42,0.16);
    }
    .hero {
      background:
        radial-gradient(circle at top right, rgba(255,255,255,0.12), transparent 30%),
        radial-gradient(circle at bottom left, rgba(34,197,94,0.18), transparent 30%),
        linear-gradient(135deg, #ffffff 0%, #e0f2fe 42%, #dcfce7 100%);
    }
    .choice-input,
    .star-input { display: none; }
    .choice-card {
      transition: all .22s ease;
    }
    .choice-input:checked + .choice-card {
      border-color: rgba(2,132,199,0.42);
      background: linear-gradient(135deg, rgba(224,242,254,0.98), rgba(255,255,255,1));
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(2,132,199,0.16);
    }
    .star-wrap {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-start;
      gap: .55rem;
    }
    .star-label {
      color: #cbd5e1;
      cursor: default;
      transition: transform .2s ease, color .2s ease;
      pointer-events: none;
    }
    .star-input:checked ~ .star-label {
      color: #f59e0b;
    }
    .readonly label {
      cursor: default;
    }
    .readonly .choice-card,
    .readonly textarea {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="px-4 py-6 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-5xl space-y-6">
      <div id="feedbackMessage" class="hidden rounded-3xl border px-5 py-4 text-sm font-semibold"></div>

      <section class="glass overflow-hidden rounded-[34px]">
        <div class="hero relative px-6 py-8 text-white sm:px-8 sm:py-10">
          <div class="absolute -right-10 top-6 h-40 w-40 rounded-full bg-sky-200/50 blur-3xl"></div>
          <div class="absolute -left-8 bottom-0 h-32 w-32 rounded-full bg-emerald-200/60 blur-3xl"></div>
          <div class="relative z-10 flex flex-col gap-6 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-start gap-4">
              <div class="flex h-16 w-16 items-center justify-center rounded-[22px] border border-slate-200 bg-white shadow-card">
                <img src="assets/logo.png" alt="NAVTTC LMS Logo" class="h-10 w-10 object-contain">
              </div>
              <div>
                <p class="text-[11px] font-black uppercase tracking-[0.34em] text-sky-700">NAVTTC LMS</p>
                <h1 class="font-display text-3xl text-slate-900 sm:text-4xl">Feedback Details</h1>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-3">
              <span class="inline-flex items-center gap-2 rounded-full bg-white px-4 py-2 text-sm font-bold text-slate-800 shadow-card">
                <i data-lucide="user-round" class="h-4 w-4 text-skypro"></i>
                <span id="studentNameDisplay">Loading...</span>
              </span>
              <button type="button" onclick="window.close()" class="inline-flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-extrabold text-slate-700 shadow-card transition hover:scale-[1.01]">
                <i data-lucide="x" class="h-4 w-4"></i>
                Close
              </button>
            </div>
          </div>
        </div>

        <div class="p-5 sm:p-8">
          <div id="loadingState" class="rounded-[28px] border border-slate-200 bg-white p-8 text-center shadow-card">
            <div class="mx-auto h-12 w-12 animate-spin rounded-full border-4 border-sky-200 border-t-skypro"></div>
            <p class="mt-4 text-sm font-semibold text-slate-500">Feedback details load ho rahi hain...</p>
          </div>

          <section id="detailsContent" class="mx-auto hidden max-w-3xl">
            <div class="mb-6 grid gap-4 sm:grid-cols-3">
              <div class="rounded-[24px] border border-slate-200 bg-white p-4 shadow-card">
                <div class="mb-3 flex h-10 w-10 items-center justify-center rounded-2xl bg-cyan-100 text-skypro"><i data-lucide="badge-info" class="h-5 w-5"></i></div>
                <p class="text-[11px] font-black uppercase tracking-[0.28em] text-slate-400">Student Name</p>
                <p id="metaName" class="mt-2 text-sm font-extrabold text-ink">-</p>
              </div>
              <div class="rounded-[24px] border border-slate-200 bg-white p-4 shadow-card">
                <div class="mb-3 flex h-10 w-10 items-center justify-center rounded-2xl bg-emerald-100 text-ocean"><i data-lucide="id-card" class="h-5 w-5"></i></div>
                <p class="text-[11px] font-black uppercase tracking-[0.28em] text-slate-400">Student ID</p>
                <p id="metaId" class="mt-2 break-all text-sm font-bold text-slate-600">-</p>
              </div>
              <div class="rounded-[24px] border border-slate-200 bg-white p-4 shadow-card">
                <div class="mb-3 flex h-10 w-10 items-center justify-center rounded-2xl bg-orange-100 text-sun"><i data-lucide="calendar-days" class="h-5 w-5"></i></div>
                <p class="text-[11px] font-black uppercase tracking-[0.28em] text-slate-400">Submitted On</p>
                <p id="metaDate" class="mt-2 text-sm font-bold text-slate-600">-</p>
              </div>
            </div>

            <form id="lmsFeedbackForm" class="readonly space-y-6">
              <div class="rounded-[28px] border border-slate-200 bg-white p-5 shadow-card sm:p-6">
                <div class="flex items-center gap-3">
                  <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-amber-100 text-sun"><i data-lucide="star" class="h-5 w-5"></i></div>
                  <label class="text-sm font-extrabold text-ink">LMS ka overall experience kaisa hai?</label>
                </div>
                <div class="mt-5 star-wrap">
                  <input class="star-input" id="star5" type="radio" name="rating" value="5" disabled>
                  <label class="star-label" for="star5"><i data-lucide="star" class="h-12 w-12 fill-current"></i></label>
                  <input class="star-input" id="star4" type="radio" name="rating" value="4" disabled>
                  <label class="star-label" for="star4"><i data-lucide="star" class="h-12 w-12 fill-current"></i></label>
                  <input class="star-input" id="star3" type="radio" name="rating" value="3" disabled>
                  <label class="star-label" for="star3"><i data-lucide="star" class="h-12 w-12 fill-current"></i></label>
                  <input class="star-input" id="star2" type="radio" name="rating" value="2" disabled>
                  <label class="star-label" for="star2"><i data-lucide="star" class="h-12 w-12 fill-current"></i></label>
                  <input class="star-input" id="star1" type="radio" name="rating" value="1" disabled>
                  <label class="star-label" for="star1"><i data-lucide="star" class="h-12 w-12 fill-current"></i></label>
                </div>
              </div>

              <div class="space-y-6 rounded-[28px] border border-slate-200 bg-white p-5 shadow-card sm:p-6">
                <div>
                  <div class="mb-3 flex items-center gap-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-cyan-100 text-skypro"><i data-lucide="book-open-text" class="h-5 w-5"></i></div>
                    <label class="text-sm font-extrabold text-ink">Course ka content kaisa hai?</label>
                  </div>
                  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-4">
                    <label><input class="choice-input" type="radio" name="content_quality" value="excellent" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Bohat achi</span></span></label>
                    <label><input class="choice-input" type="radio" name="content_quality" value="good" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Achi</span></span></label>
                    <label><input class="choice-input" type="radio" name="content_quality" value="average" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Theek thaak</span></span></label>
                    <label><input class="choice-input" type="radio" name="content_quality" value="poor" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Kamzor</span></span></label>
                  </div>
                </div>

                <div>
                  <div class="mb-3 flex items-center gap-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-emerald-100 text-ocean"><i data-lucide="users" class="h-5 w-5"></i></div>
                    <label class="text-sm font-extrabold text-ink">Teacher ki madad aur rehnumai kaisi hai?</label>
                  </div>
                  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-4">
                    <label><input class="choice-input" type="radio" name="instructor_quality" value="excellent" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Bohat achi</span></span></label>
                    <label><input class="choice-input" type="radio" name="instructor_quality" value="good" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Achi</span></span></label>
                    <label><input class="choice-input" type="radio" name="instructor_quality" value="average" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Theek thaak</span></span></label>
                    <label><input class="choice-input" type="radio" name="instructor_quality" value="poor" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Kamzor</span></span></label>
                  </div>
                </div>

                <div>
                  <div class="mb-3 flex items-center gap-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-violet-100 text-indigo-600"><i data-lucide="gauge" class="h-5 w-5"></i></div>
                    <label class="text-sm font-extrabold text-ink">Class aur course ki raftaar kaisi hai?</label>
                  </div>
                  <div class="grid gap-3 md:grid-cols-3">
                    <label><input class="choice-input" type="radio" name="course_pace" value="too_fast" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Bohat Tez</span></span></label>
                    <label><input class="choice-input" type="radio" name="course_pace" value="perfect" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Bilkul theek</span></span></label>
                    <label><input class="choice-input" type="radio" name="course_pace" value="too_slow" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Bohat aahista</span></span></label>
                  </div>
                </div>

                <div>
                  <div class="mb-3 flex items-center gap-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-pink-100 text-berry"><i data-lucide="monitor-smartphone" class="h-5 w-5"></i></div>
                    <label class="text-sm font-extrabold text-ink">LMS use karna kitna asaan hai?</label>
                  </div>
                  <div class="grid gap-3 md:grid-cols-3">
                    <label><input class="choice-input" type="radio" name="usability" value="yes" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Asaan</span></span></label>
                    <label><input class="choice-input" type="radio" name="usability" value="somewhat" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Theek thaak</span></span></label>
                    <label><input class="choice-input" type="radio" name="usability" value="no" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Mushkil</span></span></label>
                  </div>
                </div>

                <div>
                  <div class="mb-3 flex items-center gap-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-orange-100 text-sun"><i data-lucide="briefcase-business" class="h-5 w-5"></i></div>
                    <label class="text-sm font-extrabold text-ink">Kya LMS se aapka kaam asaan ho raha hai?</label>
                  </div>
                  <div class="grid gap-3 md:grid-cols-2">
                    <label><input class="choice-input" type="radio" name="would_recommend" value="yes" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Haan</span></span></label>
                    <label><input class="choice-input" type="radio" name="would_recommend" value="no" disabled><span class="choice-card block rounded-2xl border border-slate-200 bg-white px-4 py-4"><span class="block text-sm font-extrabold">Nahi</span></span></label>
                  </div>
                </div>
              </div>

              <div class="rounded-[28px] border border-slate-200 bg-white p-5 shadow-card sm:p-6">
                <div class="mb-3 flex items-center gap-3">
                  <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-teal-100 text-ocean"><i data-lucide="pen-square" class="h-5 w-5"></i></div>
                  <label class="text-sm font-extrabold text-ink">Agar koi mashwara dena ho to yahan likhein</label>
                </div>
                <textarea id="comments" rows="6" class="w-full rounded-[24px] border border-slate-200 bg-slate-50 px-5 py-4 text-sm leading-7 text-slate-700 outline-none" disabled></textarea>
              </div>
            </form>
          </section>
        </div>
      </section>
    </div>
  </main>

  <script>
    lucide.createIcons();

    const SUPABASE_URL = 'https://fnkctvhrilynnmphdxuo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_q_jbUM95dckWS7YF1XSRgg_NvhZ4iyU';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const messageBox = document.getElementById('feedbackMessage');
    const loadingState = document.getElementById('loadingState');
    const detailsContent = document.getElementById('detailsContent');

    function showMessage(type, text) {
      const styles = {
        info: 'border-sky-200 bg-sky-50 text-sky-900',
        success: 'border-emerald-200 bg-emerald-50 text-emerald-900',
        error: 'border-rose-200 bg-rose-50 text-rose-900'
      };
      messageBox.className = 'rounded-3xl border px-5 py-4 text-sm font-semibold ' + (styles[type] || styles.info);
      messageBox.textContent = text;
      messageBox.classList.remove('hidden');
    }

    function parseSummaryFeedback(content) {
      const summary = {};
      if (!content) return summary;

      String(content).split(/\r?\n+/).forEach((line) => {
        const separatorIndex = line.indexOf(':');
        if (separatorIndex === -1) return;
        const key = line.slice(0, separatorIndex).trim().toLowerCase();
        const value = line.slice(separatorIndex + 1).trim();
        if (key && value) summary[key] = value;
      });

      return summary;
    }

    function cleanValue(value) {
      if (value === null || value === undefined) return '';
      const textValue = String(value).trim();
      const normalized = textValue.toLowerCase();
      if (!textValue || normalized === 'undefined' || normalized === 'null') return '';
      return textValue;
    }

    function normalizeValue(value, type) {
      const normalized = cleanValue(value).toLowerCase();

      if (type === 'quality') {
        if (normalized === 'bohat achi') return 'excellent';
        if (normalized === 'achi') return 'good';
        if (normalized === 'theek thaak' || normalized === 'theek') return 'average';
        if (normalized === 'kamzor' || normalized === 'kharab') return 'poor';
      }

      if (type === 'pace') {
        if (normalized === 'bohat tez') return 'too_fast';
        if (normalized === 'bilkul theek') return 'perfect';
        if (normalized === 'bohat aahista' || normalized === 'bohat sust') return 'too_slow';
      }

      if (type === 'usability') {
        if (normalized === 'asaan' || normalized === 'haan, bilkul') return 'yes';
        if (normalized === 'theek thaak' || normalized === 'kuch had tak') return 'somewhat';
        if (normalized === 'mushkil' || normalized === 'nahi, mushkil hai') return 'no';
      }

      if (type === 'recommend') {
        if (normalized === 'haan' || normalized === 'zaroor') return 'yes';
        if (normalized === 'nahi' || normalized === 'bilkul nahi') return 'no';
      }

      return cleanValue(value);
    }

    async function findProfile(studentId) {
      let res = await client.from('profiles').select('full_name, name').eq('uid', studentId).maybeSingle();
      if (res.data) return res.data;
      res = await client.from('profiles').select('full_name, name').eq('id', studentId).maybeSingle();
      return res.data || null;
    }

    function setRadio(name, value) {
      if (!value) return;
      const radio = document.querySelector(`input[name="${name}"][value="${value}"]`);
      if (radio) radio.checked = true;
    }

    async function loadFeedbackDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const feedbackId = urlParams.get('id');

      if (!feedbackId) {
        showMessage('error', 'Invalid feedback ID.');
        loadingState.classList.add('hidden');
        return;
      }

      try {
        const { data, error } = await client
          .from('feedback')
          .select('*')
          .eq('id', feedbackId)
          .single();

        if (error) throw error;
        if (!data) throw new Error('Feedback not found');

        const summary = parseSummaryFeedback(data.content);
        let resolvedStudentName = cleanValue(data.student_name) || cleanValue(summary['student']);

        if (!resolvedStudentName && data.student_id) {
          const profile = await findProfile(data.student_id);
          resolvedStudentName = cleanValue(profile?.full_name) || cleanValue(profile?.name);
        }

        const submittedAt = cleanValue(data.created_at) || cleanValue(data.submitted_at) || cleanValue(data.date);
        const rawContent = cleanValue(data.content);
        const ratingFromSummary = cleanValue(summary['overall rating']).split('/')[0];
        const ratingValue = Number(cleanValue(data.rating) || ratingFromSummary || 0);
        const comments = cleanValue(data.comments)
          || cleanValue(summary['agar koi mashwara dena ho to yahan likhein'])
          || cleanValue(summary['comments'])
          || (Object.keys(summary).length === 0 ? rawContent : '')
          || 'Koi extra comment nahi diya gaya.';
        const contentQuality = normalizeValue(cleanValue(data.content_quality) || cleanValue(summary['course ka content kaisa hai?']) || cleanValue(summary['course content quality']) || cleanValue(data.quality), 'quality');
        const instructorQuality = normalizeValue(cleanValue(data.instructor_quality) || cleanValue(summary['teacher ki madad aur rehnumai kaisi hai?']) || cleanValue(summary['instructor quality']), 'quality');
        const coursePace = normalizeValue(cleanValue(data.course_pace) || cleanValue(summary['class aur course ki raftaar kaisi hai?']) || cleanValue(summary['course pace']), 'pace');
        const usability = normalizeValue(cleanValue(data.usability) || cleanValue(summary['lms use karna kitna asaan hai?']) || cleanValue(summary['platform usability']), 'usability');
        const wouldRecommend = normalizeValue(cleanValue(data.would_recommend) || cleanValue(summary['kya lms se aapka kaam asaan ho raha hai?']) || cleanValue(summary['recommendation (nps)']), 'recommend');
        const studentName = resolvedStudentName || cleanValue(data.student_id) || 'Student';

        document.getElementById('studentNameDisplay').textContent = studentName;
        document.getElementById('metaName').textContent = studentName;
        document.getElementById('metaId').textContent = cleanValue(data.student_id) || 'N/A';

        const parsedDate = submittedAt ? new Date(submittedAt) : null;
        document.getElementById('metaDate').textContent = (parsedDate && !Number.isNaN(parsedDate.getTime()))
          ? parsedDate.toLocaleString()
          : 'N/A';

        setRadio('rating', String(ratingValue));
        setRadio('content_quality', contentQuality);
        setRadio('instructor_quality', instructorQuality);
        setRadio('course_pace', coursePace);
        setRadio('usability', usability);
        setRadio('would_recommend', wouldRecommend);
        document.getElementById('comments').value = comments;

        loadingState.classList.add('hidden');
        detailsContent.classList.remove('hidden');
        lucide.createIcons();
      } catch (err) {
        console.error('Error fetching feedback details:', err);
        loadingState.classList.add('hidden');
        showMessage('error', 'Feedback details load karne mein masla hua.');
      }
    }

    loadFeedbackDetails();
  </script>
</body>
</html>
